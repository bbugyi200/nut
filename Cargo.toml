[package]
name = "nut-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Manage, check, and prove NUT UPS protection"
license = "MIT"
repository = "https://github.com/bbugyi200/nut"

[lib]
name = "nut_cli"
path = "src/lib.rs"

[[bin]]
name = "nut"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
similar = "=2.7.0"
thiserror = "=2.0.17"
toml = "=0.9.8"

[dev-dependencies]
insta = "=1.43.2"
tempfile = "=3.23.0"
