# Action pins copied from ci.yml; resolved from bob-cli on 2026-10-20.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dummy-ups:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      # Build as the runner so the toolchain and cache stay runner-owned; the
      # root harness only installs this locked binary.
      - name: Build locked release binary
        run: cargo build --locked --release --bin nut
      # sudo's secure_path drops runner tools such as just, so pass absolute
      # paths instead of relying on PATH under sudo.
      - name: Prove dummy-ups init, events, and rollback
        run: sudo env NUT_E2E_BIN="$PWD/target/release/nut" "$(command -v just)" e2e
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nut-e2e-diag
          path: /tmp/nut-e2e-diag
          if-no-files-found: ignore
