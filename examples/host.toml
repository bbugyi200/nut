# Generic host policy example. This file contains no secrets.
schema = 1

[host]
name = "example-host"

[ups.primary]
profile = "usbhid-generic"
description = "Example USB HID UPS"
port = "auto"
offdelay = "60s"
ondelay = "0s"

[ups.primary.match]
vendorid = "0764"
productid = "0601"

[ups.primary.extra]
maxretry = 3
retrydelay = 5

[shutdown]
notify_after = "30s"
early_after = "3m"
poweroff_wait = "45m"
shutdown_budget = "2m"

[notify]
from = "root@example.invalid"
to = "operator@example.invalid"
commbad_after = "60s"

[boot]
nofail_mounts = ["/srv/data"]
board_profile = "asus-prime-trx40-pro"

[operators]
users = ["operator"]
journal = false
