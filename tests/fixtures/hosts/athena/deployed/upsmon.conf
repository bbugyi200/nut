# Explicit Debian 2.8.1 defaults plus the local primary and event scheduler.
# Keep killpower on the root filesystem for the final nutshutdown hook.
# Rationale: research:202610/cp1500pfclcd_battery_swap_and_athena_auto_power_on/cp1500pfclcd_battery_swap_and_athena_auto_power_on.md (Step 5).
RUN_AS_USER nut
MONITOR cp1500@localhost 1 upsmon @UPSMON_PASSWORD@ primary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
POWERDOWNFLAG "/etc/killpower"
OFFDURATION 30
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
NOTIFYCMD /usr/sbin/upssched
NOTIFYFLAG ONBATT SYSLOG+WALL+EXEC
NOTIFYFLAG ONLINE SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+WALL+EXEC
NOTIFYFLAG COMMBAD SYSLOG+EXEC
NOTIFYFLAG COMMOK SYSLOG+EXEC
NOTIFYFLAG NOCOMM SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC
