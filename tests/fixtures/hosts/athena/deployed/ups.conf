# Retry USB enumeration at boot. This unit is 0764:0601, unlike the report's 0501.
# Delay rationale: research:202610/cp1500pfclcd_battery_swap_and_athena_auto_power_on/cp1500pfclcd_battery_swap_and_athena_auto_power_on.md (Step 5).
maxretry = 3
retrydelay = 5

[cp1500]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    productid = 0601
    desc = "CyberPower CP1500PFCLCD"
    offdelay = 60
    ondelay = 0
